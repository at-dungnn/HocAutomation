<!-- Mobile-First Responsive Dashboard -->
<div class="dashboard-container flex flex-col min-h-screen bg-gray-50">
  <!-- Header Section -->
  <header class="dashboard-header sticky top-0 z-10">
    <div class="flex items-center justify-between bg-gradient-to-r from-indigo-600 to-indigo-700 text-white px-4 py-3 shadow-md">
      <button
        pButton
        icon="pi pi-arrow-left"
        class="p-button-text p-button-rounded !text-white"
        routerLink="/"
        pTooltip="Quay lại"
      ></button>
      <h2 class="text-lg font-bold text-white">Đăng nhập</h2>
      <div class="w-10"></div>
    </div>
  </header>

  <!-- Main Content -->
  <main class="dashboard-main flex-grow overflow-y-auto pb-32">
    <div class="max-w-md mx-auto px-4 py-8">
      <!-- Logo Section -->
      <div class="text-center mb-8">
        <div class="inline-flex items-center justify-center w-20 h-20 bg-indigo-600 rounded-full mb-4">
          <i class="pi pi-graduation-cap text-4xl text-white"></i>
        </div>
        <h3 class="text-2xl font-bold text-gray-800 mb-2">Chào mừng trở lại!</h3>
        <p class="text-gray-600">Đăng nhập để tiếp tục học tập</p>
      </div>

      <!-- Form Card -->
      <div class="bg-white rounded-lg shadow-sm p-6">
        <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="space-y-5">
          <!-- Phone Input -->
          <div class="space-y-2">
            <label for="phone" class="block text-sm font-medium text-gray-700">
              Số điện thoại <span class="text-red-500">*</span>
            </label>
            <input
              pInputText
              id="phone"
              type="tel"
              formControlName="phone"
              placeholder="📱 0123456789"
              class="w-full"
              [class.p-invalid]="f['phone'].invalid && f['phone'].touched"
            />
            <small *ngIf="f['phone'].invalid && f['phone'].touched" class="text-red-500 text-xs">
              {{ getErrorMessage('phone') }}
            </small>
          </div>

          <!-- Password Input -->
          <div class="space-y-2">
            <label for="password" class="block text-sm font-medium text-gray-700">
              Mật khẩu <span class="text-red-500">*</span>
            </label>
            <p-password
              id="password"
              formControlName="password"
              placeholder="🔒 Nhập mật khẩu"
              [toggleMask]="true"
              [feedback]="false"
              styleClass="w-full"
              inputStyleClass="w-full"
              [class.p-invalid]="f['password'].invalid && f['password'].touched"
            ></p-password>
            <small *ngIf="f['password'].invalid && f['password'].touched" class="text-red-500 text-xs">
              {{ getErrorMessage('password') }}
            </small>
          </div>

          <!-- Server Error Message -->
          <div *ngIf="loginForm.errors?.['serverError']" class="bg-red-50 border border-red-200 rounded-lg p-3">
            <p class="text-red-600 text-sm flex items-center gap-2">
              <i class="pi pi-exclamation-circle"></i>
              {{ loginForm.errors?.['serverError'] }}
            </p>
          </div>

          <!-- Remember Me & Forgot Password -->
          <div class="flex items-center justify-between">
            <div class="flex items-center gap-2">
              <p-checkbox formControlName="rememberMe" inputId="rememberMe" [binary]="true"></p-checkbox>
              <label for="rememberMe" class="text-sm text-gray-700 cursor-pointer">Ghi nhớ đăng nhập</label>
            </div>
            <span class="text-sm font-medium text-indigo-600 cursor-pointer hover:underline">Quên mật khẩu?</span>
          </div>
        </form>
      </div>

      <!-- Register Link -->
      <div class="text-center mt-6">
        <p class="text-sm text-gray-600">
          Chưa có tài khoản?
          <span class="font-semibold text-indigo-600 cursor-pointer hover:underline" (click)="goToRegister()">
            Đăng ký ngay
          </span>
        </p>
      </div>
    </div>
  </main>

  <!-- Footer Navigation -->
  <footer class="dashboard-footer fixed bottom-0 left-0 right-0 bg-white border-t shadow-lg z-10">
    <div class="max-w-md mx-auto px-4 py-4 space-y-3">
      <button
        pButton
        type="submit"
        label="Đăng nhập"
        icon="pi pi-sign-in"
        class="w-full"
        [loading]="isSubmitting"
        [disabled]="isSubmitting || loginForm.invalid"
        (click)="onSubmit()"
      ></button>
      <button
        pButton
        type="button"
        label="Đăng ký tài khoản"
        icon="pi pi-user-plus"
        class="w-full"
        severity="secondary"
        [outlined]="true"
        [disabled]="isSubmitting"
        (click)="goToRegister()"
      ></button>
    </div>
  </footer>
</div>
